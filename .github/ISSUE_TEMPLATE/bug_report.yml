name: Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, plus what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `docker compose up`
        2. Open http://localhost:3000
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [API, Web, Scoring agent, Enrichment, Digest, Infra/Docker, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output from `docker compose logs api` / `web`, or the API traceback.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Docker vs native, LLM_PROVIDER value"
