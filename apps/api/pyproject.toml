[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sales-qualifier-api"
version = "0.1.0"
description = "AI Sales Lead Qualifier - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.3",
    "cryptography>=42.0.0",
    "langgraph>=0.0.20",
    "langchain-openai>=0.0.5",
    "pgvector>=0.2.4",
    "httpx>=0.26.0",
    "psycopg2-binary>=2.9.9",
    "slowapi>=0.1.9",
    "jinja2>=3.1.0",
    "email-validator>=2.1.0",
    "aiosqlite>=0.19.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9",
    "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The rules CI has always enforced (ruff's defaults when it was set up). Newer ruff releases
# select more by default, which would fail CI without any change to the code.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
