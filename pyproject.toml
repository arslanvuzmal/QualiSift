[project]
name = "cortex"
version = "0.1.0"
description = "Enterprise AI Sales Lead Qualifier"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]
